<!DOCTYPE html>
<html>
<head>
<title>Rose Day 🌹</title>

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ffd1dc,#ff9aa2);
  height:100vh;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  width:90%;
  max-width:420px;
}

h1{margin-bottom:10px;}

img{
  width:240px;
  margin:18px 0;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

button{
  padding:14px 26px;
  font-size:16px;
  border:none;
  border-radius:12px;
  margin:10px;
  cursor:pointer;
  transition:0.2s;
}

#accept{background:#4CAF50;color:white;}
#reject{background:#ff4d4d;color:white;position:relative;}
</style>
</head>

<body>

<div class="container" id="box">
<h1>🌹 Today is Rose Day</h1>
<h3>Here's a rose for you</h3>

<img src="https://i.imgur.com/0Z8FQ9L.jpeg">

<br>
<button id="accept" onclick="accepted()">Accept</button>
<button id="reject">Reject</button>
</div>

<script>
const rejectBtn=document.getElementById("reject");

rejectBtn.addEventListener("mouseover",()=>{
  const x=Math.random()*200-100;
  const y=Math.random()*200-100;
  rejectBtn.style.transform=`translate(${x}px,${y}px)`;
});

function accepted(){
document.getElementById("box").innerHTML=`
<h1>You got grass instead 😜</h1>
<img src="https://i.imgur.com/t7P0XGm.jpeg">
<h2>Are you happy?</h2>
<button id="yes">Yes</button>
<button id="no" onclick="finalRose()">No</button>
`;

const yesBtn=document.getElementById("yes");
yesBtn.addEventListener("mouseover",()=>{
  const x=Math.random()*200-100;
  const y=Math.random()*200-100;
  yesBtn.style.transform=\`translate(\${x}px,\${y}px)\`;
});
}

function finalRose(){
document.getElementById("box").innerHTML=`
<h1>😂 I'm just kidding</h1>
<h2>Here's your rose 🌹</h2>
<img src="https://i.imgur.com/0Z8FQ9L.jpeg">
<h2>Happy Rose Day 💖</h2>
`;
}
</script>

</body>
</html>
